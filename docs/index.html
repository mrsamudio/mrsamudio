<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redireccionando | Mario Samudio - Professional Portfolio</title>
  
  <!-- Instant Redirection -->
  <meta http-equiv="refresh" content="2; url=https://portfolio.ingsjobs.workers.dev/">
  <link rel="canonical" href="https://portfolio.ingsjobs.workers.dev/">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top center, #1b2735 0%, #090a0f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      padding: 20px;
      overflow: hidden;
    }

    .redirect-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .spinner-ring {
      display: inline-block;
      width: 56px;
      height: 56px;
      border: 3px solid rgba(0, 188, 212, 0.2);
      border-radius: 50%;
      border-top-color: #00bcd4;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 24px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.45em;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p {
      color: #90a4ae;
      font-size: 0.95em;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .redirect-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #00bcd4;
      color: #0b1118;
      font-weight: 600;
      font-size: 0.92em;
      padding: 12px 28px;
      border-radius: 30px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 188, 212, 0.3);
    }

    .redirect-btn:hover {
      background: #26c6da;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 188, 212, 0.45);
    }

    .countdown {
      font-size: 0.85em;
      color: #607d8b;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="redirect-card">
    <div class="spinner-ring"></div>
    <h1>Redireccionando al Portafolio</h1>
    <p>Te estamos transfiriendo a la versión interactiva y actualizada de Mario Samudio.</p>
    
    <a href="https://portfolio.ingsjobs.workers.dev/" class="redirect-btn" id="redirectLink">
      <span>Ir ahora</span> &rarr;
    </a>
    
    <div class="countdown">Redirigiendo automáticamente en <span id="timer">2</span>s...</div>
  </div>

  <script>
    const targetUrl = "https://portfolio.ingsjobs.workers.dev/";
    let timeLeft = 2;
    const timerElem = document.getElementById("timer");

    const countdown = setInterval(() => {
      timeLeft--;
      if (timerElem) timerElem.textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(countdown);
        window.location.replace(targetUrl);
      }
    }, 1000);

    setTimeout(() => {
      window.location.replace(targetUrl);
    }, 2200);
  </script>
</body>
</html>
