name: GitHub Metrics

on:
  # Schedule daily update at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
  # Run on push to main
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: mrsamudio
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Bogota
          
          # Languages
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_load: 300
          plugin_languages_recent_days: 14
          
          # Lines of code & Isometric calendar
          plugin_lines: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Achievements (Configured safely for default GITHUB_TOKEN)
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          
          # Coding Habits (Optimized for reliable API fetching)
          plugin_habits: yes
          plugin_habits_from: 100
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: no
          plugin_habits_trim: yes
